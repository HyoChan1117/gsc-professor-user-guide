# Render 배포 설정 (Blueprint) — 자세한 순서는 DEPLOY.md
# 서버 하나가 빌드된 프론트(frontend/dist)와 /api 를 같이 제공합니다.
services:
  - type: web
    name: gsc-professor-user-guide
    runtime: node
    plan: free
    buildCommand: npm run build
    # 시작할 때마다 seed — 무료 플랜은 재시작하면 파일이 초기화되므로 DB를 다시 만듦
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TRUST_PROXY
        value: "1"
      # 관리자 페이지(/admin) 비밀번호 — Render 화면에서 직접 입력 (저장소에 넣지 않음)
      - key: ADMIN_PASSWORD
        sync: false
      # (선택) AI 답변 · AI 퀴즈 — 비워 두면 키워드 검색 + 기본 퀴즈로 동작
      - key: ANTHROPIC_API_KEY
        sync: false
