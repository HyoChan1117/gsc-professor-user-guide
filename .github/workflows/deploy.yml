# GitHub Actions — 테스트 → (main 일 때) Cloudflare 배포
#
#  PR             : 빌드 + 검색 정확도 + Node 및 Workers/D1 기능 점검 (배포 안 함)
#  main push/merge: 위 테스트 통과 → Cloudflare D1(DB) 준비 · 기본 자료 반영 → Workers 배포 → 배포된 주소 점검
#  수동 실행       : Actions 탭 → "Test & deploy to Cloudflare" → Run workflow
#
#  저장소 주인이 한 번 (Settings → Secrets and variables → Actions → New repository secret):
#    CLOUDFLARE_API_TOKEN   Cloudflare API 토큰 ("Edit Cloudflare Workers" 템플릿 + D1 Edit 권한)
#    CLOUDFLARE_ACCOUNT_ID  Cloudflare 계정 ID
#    ADMIN_PASSWORD         (선택) 관리자 페이지 비밀번호
#    ANTHROPIC_API_KEY      (선택) Claude 답변 · AI 퀴즈 · 제보 AI 정리를 쓰려는 경우
#  Cloudflare 배포에 필요한 시크릿은 DEPLOY.md 참고.
name: Test & deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Build (frontend + backend 패키지)
        run: npm run build

      - name: DB 만들기 (seed — API 키 필요 없음)
        run: npm run seed --prefix backend

      - name: 검색 정확도 테스트
        run: npm run eval:check --prefix backend

      - name: Workers AI 응답과 검색 모드 전환 검증
        run: node --test backend/scripts/chat-model.test.mjs

      - name: 서버 · API 전체 점검 (제보 → 게시 → 챗봇, 한마디 → 숨기기 → 삭제)
        env:
          CI_ADMIN_PASSWORD: ci-only-test-password
          SMOKE_EXPECT_RUNTIME: node
        run: |
          PORT=8787 ADMIN_PASSWORD="$CI_ADMIN_PASSWORD" npm start --prefix backend > server.log 2>&1 &
          trap 'kill "$!" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fs http://localhost:8787/api/health > /dev/null && break; sleep 1; done
          node backend/scripts/smoke-test.mjs http://localhost:8787 "$CI_ADMIN_PASSWORD"

      - name: Cloudflare Worker 번들 확인 (배포하지 않음)
        run: |
          npm ci
          npx wrangler deploy --dry-run --outdir worker-bundle

      - name: 로컬 Workers/D1 기능 점검
        env:
          CI_ADMIN_PASSWORD: ci-only-test-password
          SMOKE_EXPECT_RUNTIME: d1
        run: |
          npm run cf:seed:local
          node node_modules/wrangler/bin/wrangler.js dev --local --ip 127.0.0.1 --port 8788 --var WORKERS_AI_ENABLED:false --var "ADMIN_PASSWORD:$CI_ADMIN_PASSWORD" > worker.log 2>&1 &
          trap 'kill "$!" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8788/api/health > /dev/null && break; sleep 1; done
          node backend/scripts/smoke-test.mjs http://127.0.0.1:8788 "$CI_ADMIN_PASSWORD"

      - name: 서버 로그 (실패했을 때)
        if: failure()
        run: cat server.log worker.log 2>/dev/null || true

  deploy:
    name: Deploy to Cloudflare
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Cloudflare 시크릿 확인
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::배포에 필요한 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID를 등록해 주세요. DEPLOY.md 참고."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Build + D1 용 기본 자료 SQL
        run: |
          npm ci
          npm run build
          npm run seed:sql --prefix backend

      - name: D1 데이터베이스 준비 (gsc-db — 없으면 만들기)
        shell: bash
        run: |
          find_id() {
            npx wrangler d1 list --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const d=JSON.parse(s).find(x=>x.name==='gsc-db');process.stdout.write(d?(d.uuid||d.id||''):'')})"
          }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            echo "gsc-db 가 없어 새로 만듭니다"
            npx wrangler d1 create gsc-db
            ID=$(find_id)
          fi
          [ -n "$ID" ] || { echo "::error::D1 데이터베이스 id 를 찾지 못했습니다"; exit 1; }
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.jsonc
          echo "D1 gsc-db = $ID"

      - name: 표 만들기 + 기본 자료 반영 (제보 · 한마디 · 챗봇 기록은 그대로)
        run: npx wrangler d1 execute gsc-db --remote --file backend/data/d1-seed.sql -y

      - name: Workers 배포
        id: deploy
        shell: bash
        run: |
          npx wrangler deploy | tee deploy.log
          URL=$(grep -m1 -oE 'https://gsc-professor-user-guide\.[a-zA-Z0-9-]+\.workers\.dev' deploy.log) || {
            echo "::error::workers.dev 배포 주소를 찾지 못했습니다. Cloudflare에서 workers.dev 하위 주소를 설정해 주세요."
            exit 1
          }
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Worker 시크릿 반영 (ADMIN_PASSWORD · ANTHROPIC_API_KEY — 있을 때만)
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ADMIN_PASSWORD" ]; then printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          else echo "ADMIN_PASSWORD 시크릿 미등록"; fi
          if [ -n "$ANTHROPIC_API_KEY" ]; then printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          else echo "ANTHROPIC_API_KEY 시크릿 미등록"; fi

      - name: 배포된 주소 점검 (읽기 전용)
        env:
          SMOKE_EXPECT_RUNTIME: d1
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in $(seq 1 20); do curl -fs "$DEPLOY_URL/api/health" > /dev/null && break; sleep 3; done
          node backend/scripts/smoke-test.mjs "$DEPLOY_URL" --readonly
          echo "### 배포 완료: $DEPLOY_URL" >> "$GITHUB_STEP_SUMMARY"
